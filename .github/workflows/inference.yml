name: Multi-Job Inference Pipeline

on:
  push:
    branches: [ inference ]
  pull_request:
    branches: [ inference ]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        pytest tests/ -v

  train:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      status: ${{ job.status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run training
      run: |
        cd src
        python train.py
        
    - name: Upload model artifact
      uses: actions/upload-artifact@v3
      with:
        name: model-train
        path: src/model_train.pkl

  inference:
    runs-on: ubuntu-latest
    needs: train
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download model artifact
      uses: actions/download-artifact@v3
      with:
        name: model-train
        path: src/
        
    - name: Run inference
      run: |
        cd src
        python inference.py 